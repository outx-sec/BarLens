<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="280" rx="22" fill="url(#archBg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- Box 1: BarLens Main UI Process -->
  <g transform="translate(36, 42)">
    <rect width="290" height="196" rx="16" fill="#1E293B" fill-opacity="0.65" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <text x="24" y="36" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">PROCESS 1 · UI &amp; LENS</text>
    <text x="24" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">BarLens (Main App)</text>
    <text x="24" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• Liquid Glass Floating Bar &amp; Settings</text>
    <text x="24" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• AX Menu Bar Enumeration &amp; Click Proxy</text>
    <text x="24" y="144" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• Control Center Ledger Sync (18 Items)</text>
    <text x="24" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Never holds the system assertion directly</text>
  </g>

  <!-- Arrow 1: Heartbeat IPC -->
  <g transform="translate(338, 114)">
    <line x1="0" y1="26" x2="88" y2="26" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="88,21 98,26 88,31" fill="#38BDF8"/>
    <text x="49" y="14" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">2s Heartbeat</text>
    <text x="49" y="46" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">10s Auto-Expire</text>
  </g>

  <!-- Box 2: BarLensAgent Helper -->
  <g transform="translate(448, 42)">
    <rect width="268" height="196" rx="16" fill="#1E293B" fill-opacity="0.65" stroke="#A855F7" stroke-opacity="0.6" stroke-width="1.4"/>
    <text x="24" y="36" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">PROCESS 2 · GUARDIAN DAEMON</text>
    <text x="24" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">BarLensAgent</text>
    <text x="24" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• Owns XPC Assertion Lifecycle</text>
    <text x="24" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• Polls Command State Every 150ms</text>
    <text x="24" y="144" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5">• Zero Status Items of Its Own</text>
    <text x="24" y="168" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">✓ Instant rollback on UI quit or crash</text>
  </g>

  <!-- Arrow 2: XPC Assertion -->
  <g transform="translate(728, 114)">
    <line x1="0" y1="26" x2="62" y2="26" stroke="#A855F7" stroke-width="2"/>
    <polygon points="62,21 72,26 62,31" fill="#A855F7"/>
    <text x="36" y="14" fill="#D8B4FE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">XPC</text>
  </g>

  <!-- Box 3: macOS 27 MenuBarAgent -->
  <g transform="translate(812, 42)">
    <rect width="232" height="196" rx="16" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="22" y="36" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">macOS 27 SYSTEM</text>
    <text x="22" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">MenuBarAgent</text>
    <text x="22" y="96" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• MenuBarClientCore</text>
    <text x="22" y="120" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Bundle ID Allow-List</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• System Item Bitmask</text>
    <text x="24" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Native WindowServer Layout</text>
  </g>
</svg>
